services:
  disgo:
    build:
      context: ./discord-bot
      dockerfile: deployments/docker/Dockerfile
    restart: always
    environment:
      - TZ=America/Los_Angeles
    networks:
      - pcep
    depends_on:
      webscraper:
        condition: service_healthy
    env_file:
      - .env

  webscraper:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=America/Los_Angeles
    networks:
      - pcep
    ports:
      - 8100:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  jobs-db-service:
    build:
      context: ./jobs-db-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - TZ=America/Los_Angeles
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - ENV=prod
    networks:
      - pcep
    ports:
      - 8080:8080

  db:
    image: postgres:18-alpine
    restart: always
    networks:
      - pcep
    ports:
      - 5432:5432
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
      - ./jobs-db-service/src/main/resources/db/migration/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql
      - ./jobs-db-service/src/main/resources/db/migration/0002_operations.sql:/docker-entrypoint-initdb.d/0002_operations.sql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8090:8080
    networks:
      - pcep

volumes:
  postgres:

networks:
  pcep:
    driver: bridge