services:
  disgo:
    build:
      context: ./discord-bot
      dockerfile: deployments/docker/Dockerfile
    restart: always
    environment:
      - TZ=America/Los_Angeles
    networks:
      - pcep
    depends_on:
      webscraper:
        condition: service_healthy

  webscraper:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=America/Los_Angeles
    networks:
      - pcep
    ports:
      - 8100:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
networks:
  pcep:
    driver: bridge