services:
  disgo:
    build:
      context: ./discord-bot
      dockerfile: deployments/docker/Dockerfile
    restart: always
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - TZ=America/Los_Angeles
  webscraper:
    build:
      context: ./webscraper
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=America/Los_Angeles